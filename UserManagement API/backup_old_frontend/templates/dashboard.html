<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - User Management</title>
<link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

  <header class="topbar">
    <h1>User Management</h1>
    <div class="who">
      <span id="who-username">...</span>
      <span id="who-role" class="badge"></span>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="main">

    <!-- My profile (everyone) -->
    <section class="panel">
      <h2>My profile</h2>
      <form id="profile-form">
        <label>Name
          <input type="text" id="profile-name" required minlength="1">
        </label>
        <label>Email
          <input type="email" id="profile-email" required>
        </label>
        <p id="profile-error" class="form-error" hidden></p>
        <p id="profile-success" class="form-success" hidden></p>
        <div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
      <p class="muted" style="margin-top:10px;">
        Note: role changes aren't available here — only another admin can change your role via the users table.
      </p>
    </section>

    <!-- All users (admin only) -->
    <section class="panel" id="admin-section" hidden>
      <h2>All users</h2>
      <p id="users-error" class="form-error" hidden></p>
      <table class="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </section>

  </main>

  <!-- Edit user modal (admin editing a non-admin user) -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <h3 id="modal-title">Edit user</h3>
      <form id="edit-user-form">
        <input type="hidden" id="edit-user-id">
        <label>Name
          <input type="text" id="edit-name" required minlength="1">
        </label>
        <label>Email
          <input type="email" id="edit-email" required>
        </label>
        <label>Role
          <select id="edit-role">
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
        </label>
        <p id="modal-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<!-- At the bottom of dashboard.html -->
<script type="module" src="../static/js/api.js"></script>
<script type="module" src="../static/js/dashboard.js"></script>
</body>
</html>
